paths:
  data_dir: "data"
  html_dir: "data/html"
  db_path: "data/db.sqlite"
  features_dir: "data/features"
  models_dir: "models"

scraping:
  interval: 1.0  # リクエスト間隔(秒)。netkeiba負荷軽減のため1秒以上推奨
  retry_count: 3
  user_agent: "KeibaAI/1.0 (+https://github.com/user/keiba_ai)"

model:
  # ======================================================================
  # 学習期間の設定方法:
  #   train: モデルが学習するデータの年 (古い方。量が多いほど精度向上)
  #   val:   学習の停止判定 + 勝率の校正に使う年 (trainの直後の年)
  #   test:  最終評価用の年 (最も新しい年)
  #
  #   必ず train < val < test の時系列順にすること。
  #
  # 例1: 2018〜2025年分のデータがある場合(推奨)
  #   target_years_train: [2018, 2019, 2020, 2021, 2022, 2023]
  #   target_year_val: 2024
  #   target_year_test: 2025
  #
  # 例2: 少ないデータでの動作確認用
  #   target_years_train: [2023, 2024]
  #   target_year_val: 2025
  #   target_year_test: 2025
  # ======================================================================
  target_years_train: [2018, 2019, 2020, 2021, 2022, 2023]
  target_year_val: 2024
  target_year_test: 2025

  lgb_params:
    objective: "lambdarank"
    metric: "ndcg"
    ndcg_eval_at: [1, 3]
    boosting_type: "gbdt"
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 20
    random_state: 42
    verbose: -1

betting:
  odds_margin: 0.90    # オッズに掛ける安全係数 (0.90 = 10%減で評価)
  min_expected_value: 1.1  # 期待値がこの値以上の馬だけ購入候補にする
  kelly_fraction: 0.25  # 購入金額 = ケリー基準の比率 * この係数 * 資金 (1.0 はフルケリー。推定誤差に弱いので小さめを推奨)

simulation:
  test_start: "2021-01-01"  # ウォークフォワード検証の最初のテスト期間の開始日。以降半年ごとにスライドする
  initial_bankroll: 100000  # 資金推移シミュレーションの初期資金(円)
